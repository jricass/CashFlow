trigger:
- main

variables:
  dockerRegistryServiceConnection: 'fc7bb131-203f-4117-8190-0946276e0f47'
  imageRepository: 'cashflow'
  containerRegistry: 'apicashflow.azurecr.io'
  dockerfilePath: 'Dockerfile'
  tag: '$(Build.BuildId)'

pool:
  vmImage: 'ubuntu-latest'

steps:

- task: DownloadSecureFile@1
  name: appsettings
  displayName: Download AppSettings.json
  inputs:
    secureFile: appsettings.Production.json

- script: |
    cp $(appsettings.secureFilePath) src/CashFlow.Api/appsettings.Production.json

- task: Docker@2
  displayName: Build and push an image to container registry
  inputs:
    command: buildAndPush
    repository: $(imageRepository)
    dockerfile: $(dockerfilePath)
    containerRegistry: $(dockerRegistryServiceConnection)
    tags: |
      latest
      $(tag)